<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pelanduk Putih</title>
    <style>
        body { background: #0f172a; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; font-family: 'Georgia', serif; }
        .card { width: 90%; max-width: 420px; background: #fff; padding: 20px; border-radius: 16px; border: 4px solid #d4af37; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .anim { width: 100%; height: 160px; background: #d1e7dd; border-radius: 10px; overflow: hidden; display: flex; justify-content: center; align-items: center; border: 2px solid #285238; margin-bottom: 15px; }
        .anim img { width: 100%; height: 100%; object-fit: cover; }
        .btn { background: #4a150b; color: #ffecb3; border: 2px solid #d4af37; padding: 10px 24px; font-size: 1rem; font-weight: bold; border-radius: 20px; cursor: pointer; margin-top: 10px; }
        .btn:hover { background: #7b1fa2; }
    </style>
</head>
<body>
    <div class="card">
        <div class="anim">
            <img src="https://media.giphy.com/media/3oKIPnAiaMCws8nOsE/giphy.gif" alt="Animasi Pelanduk">
        </div>
        <h2 style="color: #4a150b; margin: 10px 0; font-size: 1.3rem;">Kisah Pelanduk Putih</h2>
        <p style="font-size: 0.9rem; color: #5d4037; line-height: 1.4;">Saksikan animasi di atas dan mulakan pengembaraan sejarah Melaka sekarang!</p>
        <button class="btn" onclick="alert('Kembara Bermula!')">MULA 🐇</button>
    </div>
</body>
</html>
