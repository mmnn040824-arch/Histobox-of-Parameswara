<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Episod 5: Sening Ujong & Muara Sungai Bertam</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Georgia', serif;
            user-select: none;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0d1b2a 0%, #1b263b 50%, #415a77 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 100;
        }

        /* Latar belakang air bergerak lembut */
        .water-bg {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 35vh;
            background: linear-gradient(to top, #1d3557, #457b9d);
            opacity: 0.8;
            z-index: 1;
            border-top: 4px solid #ffd700;
        }

        .game-container {
            width: 90%;
            max-width: 780px;
            background: rgba(255, 255, 255, 0.95);
            border: 5px solid #d4af37;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
            position: relative;
            z-index: 10;
            text-align: center;
        }

        /* Kapal animasi bebas merentasi skrin atas */
        .moving-ship-container {
            position: absolute;
            top: -65px;
            left: 10%;
            font-size: 3rem;
            transition: left 1s cubic-bezier(0.34, 1.56, 0.64, 1);
            z-index: 15;
            filter: drop-shadow(0 5px 8px rgba(0,0,0,0.4));
        }

        .header-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #2b1d0c;
            color: #ffecb3;
            padding: 10px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border: 2px solid #d4af37;
            font-weight: bold;
        }

        .question-box {
            font-size: 1.25rem;
            font-weight: 700;
            color: #2c1d18;
            margin-bottom: 20px;
            line-height: 1.5;
            background: #fff8e1;
            padding: 20px;
            border-radius: 14px;
            border: 2px solid #ffe082;
        }

        .cards-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin-bottom: 15px;
        }

        .option-card {
            background: #ffffff;
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1.05rem;
            font-weight: 600;
            color: #3e2723;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }

        .option-card:hover {
            background: #fff3e0;
            border-color: #b8860b;
            transform: translateY(-2px);
        }

        .option-card.correct {
            background: #c8e6c9 !important;
            border-color: #2e7d32 !important;
            color: #1b5e20 !important;
        }

        .option-card.wrong {
            background: #ffcdd2 !important;
            border-color: #c62828 !important;
            color: #b71c1c !important;
        }

        .btn-start {
            background: linear-gradient(45deg, #4a150b, #7b1fa2);
            color: #ffecb3;
            border: 2px solid #d4af37;
            padding: 14px 35px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }

        .btn-start:hover {
            transform: scale(1.05);
        }

        .audio-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #4a150b;
            color: #ffecb3;
            border: 2px solid #d4af37;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 20;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <canvas id="confetti-canvas"></canvas>
    <div class="water-bg"></div>

    <div class="game-container">
        <button class="audio-btn" id="audioToggle" onclick="toggleSound()">🎵</button>

        <!-- SKRIN MULA -->
        <div id="startScreen" style="padding: 20px;">
            <h1 style="color: #4a150b; font-size: 1.8rem; margin-bottom: 10px;">EPISOD 5: SENING UJONG & SUNGAI BERTAM</h1>
            <p style="color: #5d4037; font-size: 1.05rem; margin-bottom: 25px;">Jelajahi pengembaraan tanpa kotak kaku! Jawab 5 soalan (5 markah setiap satu) dan lihat kapal berlayar ke destinasi.</p>
            <button class="btn-start" onclick="startGame()">MULA KEMBARA ⛵</button>
        </div>

        <!-- SKRIN PERMAINAN -->
        <div id="gameScreen" class="hidden">
            <!-- Kapal bergerak bebas di atas kotak permainan -->
            <div class="moving-ship-container" id="shipObj">⛵</div>

            <div class="header-info">
                <span id="questionNum">Soalan 1/5</span>
                <span>⭐ Markah: <span id="scoreText">0</span> / 25</span>
            </div>

            <div class="question-box" id="questionText">Soalan...</div>
            <div class="cards-grid" id="optionsGrid"></div>
        </div>

        <!-- SKRIN TAMAT -->
        <div id="endScreen" class="hidden" style="padding: 20px;">
            <h1 style="color: #4a150b; font-size: 1.8rem;">🎉 TAHNIAH! SELESAI EPISOD 5 🎉</h1>
            <p style="color: #5d4037; font-size: 1.1rem; margin: 15px 0;">Jumlah Markah Anda:</p>
            <div style="font-size: 2.2rem; font-weight: bold; color: #b8860b; margin-bottom: 20px;"><span id="finalScore">0</span> / 25</div>
            <button class="btn-start" onclick="startGame()">MAIN SEMULA 🔄</button>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let bgmInterval = null;
        let isMuted = false;

        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playTone(freq, type, duration, vol = 0.3) {
            if (isMuted || !audioCtx) return;
            try {
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch(e) {}
        }

        function startBGM() {
            initAudio();
            if (bgmInterval) clearInterval(bgmInterval);
            let notes = [261.63, 329.63, 392.00, 523.25];
            let idx = 0;
            bgmInterval = setInterval(() => {
                if (!isMuted) {
                    playTone(notes[idx], 'triangle', 0.4, 0.1);
                    idx = (idx + 1) % notes.length;
                }
            }, 500);
        }

        function playSFX(type) {
            initAudio();
            if (isMuted) return;
            if (type === 'correct') {
                playTone(523.25, 'sine', 0.2, 0.4);
                setTimeout(() => playTone(659.25, 'sine', 0.25, 0.4), 120);
                setTimeout(() => playTone(783.99, 'sine', 0.3, 0.4), 240);
            } else if (type === 'wrong') {
                playTone(140, 'sawtooth', 0.3, 0.4);
            } else if (type === 'win') {
                [392, 523.25, 659.25, 783.99].forEach((n, i) => {
                    setTimeout(() => playTone(n, 'sine', 0.3, 0.4), i * 150);
                });
            }
        }

        function toggleSound() {
            isMuted = !isMuted;
            document.getElementById('audioToggle').innerText = isMuted ? '🔇' : '🎵';
        }

        const questions = [
            {
                q: "Selepas meninggalkan Muar, apakah lokasi seterusnya yang dituju oleh Parameswara dalam perjalanan baginda?",
                options: ["Sening Ujong", "Temasik", "Melaka"],
                correct: 0
            },
            {
                q: "Apakah tindakan penting yang dilakukan oleh Parameswara semasa berada di Sening Ujong?",
                options: ["Melantik seorang wakil pemerintah untuk menguruskan kawasan tersebut", "Membina kota pertahanan batu yang besar dan kukuh", "Membuka pelabuhan bebas cukai antarabangsa"],
                correct: 0
            },
            {
                q: "Selepas meninggalkan Sening Ujong, di manakah tempat persinggahan seterusnya bagi Parameswara dan pengikutnya?",
                options: ["Muara Sungai Bertam", "Pahang Tua", "Pulau Pinang"],
                correct: 0
            },
            {
                q: "Apakah ciri persekitaran fizikal yang terdapat di lokasi persinggahan baginda di muara Sungai Bertam?",
                options: ["Sebuah perkampungan nelayan", "Sebuah kota istana yang tersergam indah", "Kawasan padang pasir yang luas"],
                correct: 0
            },
            {
                q: "[SOALAN KBAT] Mengapakah tindakan melantik wakil pemerintah di wilayah yang disinggahi seperti Sening Ujong merupakan langkah kepimpinan yang sangat strategik?",
                options: ["Bagi memastikan kestabilan pentadbiran dan keselamatan wilayah tersebut sentiasa terpelihara", "Supaya baginda tidak perlu lagi kembali semula ke wilayah berkenaan selama-lamanya", "Untuk menyerahkan kuasa penuh kepada penduduk tempatan tanpa sebarang syarat"],
                correct: 0
            }
        ];

        let currentIdx = 0;
        let score = 0;
        let canAnswer = true;

        function startGame() {
            startBGM();
            document.getElementById('startScreen').classList.add('hidden');
            document.getElementById('gameScreen').classList.remove('hidden');
            document.getElementById('endScreen').classList.add('hidden');
            currentIdx = 0;
            score = 0;
            loadQuestion();
        }

        function loadQuestion() {
            canAnswer = true;
            let q = questions[currentIdx];
            document.getElementById('questionNum').innerText = `Soalan ${currentIdx + 1}/5`;
            document.getElementById('questionText').innerText = q.q;

            // Kapal bergerak maju mengikut nombor soalan secara lancar di atas kotak
            let posPercent = 10 + (currentIdx / (questions.length - 1)) * 75;
            document.getElementById('shipObj').style.left = `${posPercent}%`;

            let grid = document.getElementById('optionsGrid');
            grid.innerHTML = '';
            q.options.forEach((opt, idx) => {
                let card = document.createElement('div');
                card.className = 'option-card';
                card.innerText = opt;
                card.onclick = () => selectOption(idx, card);
                grid.appendChild(card);
            });
        }

        function selectOption(idx, card) {
            if (!canAnswer) return;
            canAnswer = false;
            let q = questions[currentIdx];
            let cards = document.querySelectorAll('.option-card');

            if (idx === q.correct) {
                card.classList.add('correct');
                playSFX('correct');
                score += 5;
                fireConfetti();
            } else {
                card.classList.add('wrong');
                cards[q.correct].classList.add('correct');
                playSFX('wrong');
            }

            document.getElementById('scoreText').innerText = score;

            setTimeout(() => {
                currentIdx++;
                if (currentIdx < questions.length) {
                    loadQuestion();
                } else {
                    document.getElementById('gameScreen').classList.add('hidden');
                    document.getElementById('endScreen').classList.remove('hidden');
                    document.getElementById('finalScore').innerText = score;
                    if (bgmInterval) clearInterval(bgmInterval);
                    playSFX('win');
                    fireConfetti();
                }
            }, 1500);
        }

        // Konfeti ringan
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        canvas.width = window.innerWidth; canvas.height = window.innerHeight;

        function fireConfetti() {
            for (let i = 0; i < 70; i++) {
                particles.push({
                    x: window.innerWidth / 2, y: window.innerHeight / 2,
                    vx: (Math.random() - 0.5) * 15, vy: (Math.random() - 2) * 10,
                    size: Math.random() * 8 + 4, color: ['#d4af37', '#e63946', '#2a9d8f', '#ffb703'][Math.floor(Math.random()*4)],
                    alpha: 1
                });
            }
        }

        function updateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, i) => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.3; p.alpha -= 0.02;
                ctx.fillStyle = p.color; ctx.globalAlpha = Math.max(0, p.alpha);
                ctx.fillRect(p.x, p.y, p.size, p.size);
                if (p.alpha <= 0) particles.splice(i, 1);
            });
            requestAnimationFrame(updateConfetti);
        }
        updateConfetti();
    </script>
</body>
</html>
